.card{padding:17px}.card h2{font-size:1.4rem;letter-spacing:-.025em;line-height:1.2}.subtitle{color:var(--muted);font-size:.9rem;margin:4px 0 12px}.stops,.routes,.all-days{padding:0;margin:0;list-style:none}.stops li,.all-days li{border-top:1px solid var(--line)}.stop,.all-days button{display:block;width:100%;text-align:left;padding:10px 0;border:0;background:transparent}.stop[data-id],.all-days button,nav button,.mapbar button,.overview{cursor:pointer}.stop[data-id]:hover,.all-days button:hover,.stop.selected{background:#eaf4ef}.stop-title{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-weight:700}.order{background:#e8f2ed;color:var(--accent);min-width:1.6em;padding:1px 4px;border-radius:6px;text-align:center;font-size:.8rem}.time{font-size:.86rem;color:var(--muted);font-weight:650}.note{display:block;margin-top:3px;font-size:.88rem;color:var(--muted)}.status{display:inline-block;color:#833b13;background:#faede1;padding:1px 6px;border-radius:5px;font-size:.77rem;font-weight:700}.routes-card{margin-top:16px}.routes li{margin-top:8px}.link{display:flex;align-items:center;min-height:44px;padding:7px 10px;background:#e7f2ee;border:1px solid #c4ddd3;color:var(--accent);font-weight:650;border-radius:8px;text-decoration:underline;text-underline-offset:3px;font-size:.88rem}

<div class="wrap">
<header><div><h1>Наш отпуск 2027</h1><p>29 декабря 2026 — 13 января 2027 · Время местное</p></div><button type="button" id="overview" class="overview" aria-pressed="true">Весь маршрут</button></header>
<nav id="dates" aria-label="Даты путешествия"></nav>
<noscript><style>.overview,#dates,.layout{display:none}summary{cursor:pointer;padding:8px 0}#offline-plan a{color:#155e51}#offline-plan li{margin:5px 0}#offline-plan h2{margin-top:12px}</style><section id="offline-plan" class="card"><p>В этом режиме доступен план поездки. Для интерактивной карты откройте файл в HTML‑просмотрщике с поддержкой JavaScript.</p><h2>Прогулки в Google Maps</h2><ul><li><a href="https://www.google.com/maps/dir/?api=1&amp;origin=KL+Sentral+Kuala+Lumpur&amp;destination=Jalan+Alor+Food+Street+Kuala+Lumpur&amp;travelmode=walking&amp;waypoints=Petronas+Twin+Towers+Kuala+Lumpur">9 января · Куала-Лумпур · варианты прогулки</a></li><li><a href="https://www.google.com/maps/dir/?api=1&amp;origin=Merlion+Park+Singapore&amp;destination=Supertree+Grove+Gardens+by+the+Bay+Singapore&amp;travelmode=walking&amp;waypoints=1.28732%2C103.85435%7C1.2889%2C103.85603%7C1.28753%2C103.86062">10 января · Сингапур · 1. Мерлион → Supertree Grove</a></li><li><a href="https://www.google.com/maps/dir/?api=1&amp;origin=Supertree+Grove+Gardens+by+the+Bay+Singapore&amp;destination=Lau+Pa+Sat+Singapore&amp;travelmode=walking">10 января · Сингапур · 2. Supertree Grove → Lau Pa Sat</a></li><li><a href="https://www.google.com/maps/dir/?api=1&amp;origin=Chinatown+Singapore&amp;destination=SkyPark+Observation+Deck+Marina+Bay+Sands+Singapore&amp;travelmode=walking&amp;waypoints=Hawker+Chan+78+Smith+Street+Singapore">11 января · Сингапур · Чайнатаун → SkyPark</a></li><li><a href="https://www.google.com/maps/dir/?api=1&amp;origin=SkyPark+Observation+Deck+Marina+Bay+Sands+Singapore&amp;destination=Haji+Lane+Kampong+Glam+Singapore&amp;travelmode=walking">11 января · Сингапур · продолжение до Haji Lane по желанию</a></li></ul><h2>План по дням</h2><details><summary>29 декабря · Москва → Пекин</summary><ol><li>14:30 · Шереметьево (SVO). Быть в Шереметьево. Терминал C. <a href="https://www.google.com/maps/search/?api=1&amp;query=Sheremetyevo+Terminal+C">Google Maps</a></li><li>17:25 · Шереметьево (SVO). Вылет Air China CA754. <a href="https://www.google.com/maps/search/?api=1&amp;query=Sheremetyevo+Terminal+C">Google Maps</a></li></ol></details><details><summary>30 декабря · Пекин → Бангкок</summary><ol><li>05:45 · Пекин Шоуду (PEK). Прилёт CA754. Терминал 3. <a href="https://www.google.com/maps/search/?api=1&amp;query=Beijing+Capital+International+Airport+Terminal+3">Google Maps</a></li><li>09:20 · Пекин Шоуду (PEK). Вылет Air China CA885. <a href="https://www.google.com/maps/search/?api=1&amp;query=Beijing+Capital+International+Airport+Terminal+3">Google Maps</a></li><li>13:40 · Суварнабхуми (BKK). Прилёт в Суварнабхуми. <a href="https://www.google.com/maps/search/?api=1&amp;query=Suvarnabhumi+Airport">Google Maps</a></li><li>Отель в Бангкоке. Заселение на две ночи. Отель не указан.</li></ol></details><details><summary>31 декабря · Новый год в Бангкоке</summary><ol><li>Вечером · ICONSIAM · Вариант. Одна из двух площадок для встречи Нового года. <a href="https://www.google.com/maps/search/?api=1&amp;query=ICONSIAM+Bangkok">Google Maps</a></li><li>Вечером · One Bangkok · Вариант. Альтернативная площадка для встречи Нового года. <a href="https://www.google.com/maps/search/?api=1&amp;query=One+Bangkok">Google Maps</a></li></ol></details><details><summary>1 января · Бангкок → Паттайя</summary><ol><li>Бангкок. Выезд из Бангкока. Точка отправления показана по городу. <a href="https://www.google.com/maps/search/?api=1&amp;query=Bangkok+Thailand">Google Maps</a></li><li>Birds &amp; Bees Resort. Трансфер в район Пратамнак. Семь ночей, до 8 января. <a href="https://www.google.com/maps/search/?api=1&amp;query=Birds+and+Bees+Resort+Pattaya">Google Maps</a></li><li>На закате · Cabbages &amp; Condoms. Ужин в ресторане при отеле. <a href="https://www.google.com/maps/search/?api=1&amp;query=Cabbages+and+Condoms+Birds+and+Bees+Resort+Pattaya">Google Maps</a></li></ol></details><details><summary>2 января · Ко Лан</summary><ol><li>Пирс Бали Хай. Отправление парома из Паттайи. <a href="https://www.google.com/maps/search/?api=1&amp;query=Bali+Hai+Pier+Pattaya">Google Maps</a></li><li>Ко Лан. Прибытие на остров. Метка обозначает остров, причал не указан. <a href="https://www.google.com/maps/search/?api=1&amp;query=Ko+Lan+Thailand">Google Maps</a></li><li>Пляж Тиен · Вариант. Один из двух пляжей. <a href="https://www.google.com/maps/search/?api=1&amp;query=Tien+Beach+Koh+Larn">Google Maps</a></li><li>Пляж Самэ · Вариант. Альтернативный пляж. <a href="https://www.google.com/maps/search/?api=1&amp;query=Samae+Beach+Koh+Larn">Google Maps</a></li><li>Пирс Бали Хай. Возвращение паромом в Паттайю. <a href="https://www.google.com/maps/search/?api=1&amp;query=Bali+Hai+Pier+Pattaya">Google Maps</a></li></ol></details><details><summary>3 января · Паттайя</summary><ol><li>Днём · Birds &amp; Bees Resort. Бассейн отеля. <a href="https://www.google.com/maps/search/?api=1&amp;query=Birds+and+Bees+Resort+Pattaya">Google Maps</a></li><li>После бассейна · Храм Истины. Посещение Храма Истины. <a href="https://www.google.com/maps/search/?api=1&amp;query=Sanctuary+of+Truth+Pattaya">Google Maps</a></li></ol></details><details><summary>4 января · Юг Паттайи</summary><ol><li>Кхао Чи Чан. Первый пункт поездки. <a href="https://www.google.com/maps/search/?api=1&amp;query=Khao+Chi+Chan+Buddha+Mountain+Thailand">Google Maps</a></li><li>Ват Янасангварам. Храмовый комплекс. <a href="https://www.google.com/maps/search/?api=1&amp;query=Wat+Yansangwararam+Thailand">Google Maps</a></li><li>Silverlake Vineyard. Виноградник. <a href="https://www.google.com/maps/search/?api=1&amp;query=Silverlake+Vineyard+Pattaya">Google Maps</a></li><li>Ужин · Банг Саре. Морепродукты. Метка обозначает Банг Саре, ресторан не выбран. <a href="https://www.google.com/maps/search/?api=1&amp;query=Bang+Sare+Chon+Buri+Thailand">Google Maps</a></li></ol></details><details><summary>5 января · Пляж и плавучий рынок</summary><ol><li>Днём · Birds &amp; Bees Resort. Пляж и отдых у отеля. <a href="https://www.google.com/maps/search/?api=1&amp;query=Birds+and+Bees+Resort+Pattaya">Google Maps</a></li><li>После отдыха · Плавучий рынок Паттайи. Посещение плавучего рынка. <a href="https://www.google.com/maps/search/?api=1&amp;query=Pattaya+Floating+Market">Google Maps</a></li></ol></details><details><summary>6 января · Паттайя</summary><ol><li>Днём · Зоопарк Кхао Кхео · Вариант. Один из вариантов на день. <a href="https://www.google.com/maps/search/?api=1&amp;query=Khao+Kheow+Open+Zoo+Thailand">Google Maps</a></li><li>Днём · Кулинарный мастер-класс · Вариант. Место проведения пока не выбрано.</li><li>Вечером · Walking Street. Прогулка по Walking Street. <a href="https://www.google.com/maps/search/?api=1&amp;query=Walking+Street+Pattaya">Google Maps</a></li></ol></details><details><summary>7 января · Пратамнак и вечер в Паттайе</summary><ol><li>Смотровая Пратамнак. Смотровая площадка. <a href="https://www.google.com/maps/search/?api=1&amp;query=Pattaya+Viewpoint+Khao+Phra+Tamnak">Google Maps</a></li><li>Храм Большого Будды. Храм Большого Будды после смотровой. <a href="https://www.google.com/maps/search/?api=1&amp;query=Big+Buddha+Temple+Pattaya">Google Maps</a></li><li>Вечером · Массаж. Место не выбрано.</li><li>Вечером · Ночной рынок. Конкретный рынок не выбран.</li><li>Вечером · Birds &amp; Bees Resort. Сборы перед выездом. <a href="https://www.google.com/maps/search/?api=1&amp;query=Birds+and+Bees+Resort+Pattaya">Google Maps</a></li></ol></details><details><summary>8 января · Паттайя → Донмыанг</summary><ol><li>Днём · Birds &amp; Bees Resort. Выезд из Birds &amp; Bees Resort. <a href="https://www.google.com/maps/search/?api=1&amp;query=Birds+and+Bees+Resort+Pattaya">Google Maps</a></li><li>Днём · Донмыанг (DMK). Переезд в район Донмыанга. Метка обозначает аэропорт. <a href="https://www.google.com/maps/search/?api=1&amp;query=Don+Mueang+International+Airport+Terminal+1">Google Maps</a></li><li>Ночью · Отель рядом с Донмыангом. Оставить чемоданы до 11 января по договорённости с отелем. Отель не указан.</li></ol></details><details><summary>9 января · Бангкок → Куала-Лумпур</summary><ol><li>06:30 · Донмыанг (DMK). Быть в аэропорту. Терминал 1. <a href="https://www.google.com/maps/search/?api=1&amp;query=Don+Mueang+International+Airport+Terminal+1">Google Maps</a></li><li>08:35 · Донмыанг (DMK). Вылет AirAsia AK891. <a href="https://www.google.com/maps/search/?api=1&amp;query=Don+Mueang+International+Airport+Terminal+1">Google Maps</a></li><li>11:55 · Куала-Лумпур (KUL). Прилёт. Терминал 2. <a href="https://www.google.com/maps/search/?api=1&amp;query=Kuala+Lumpur+International+Airport+Terminal+2">Google Maps</a></li><li>Около 13:30 · KL Sentral. Из аэропорта на KLIA Ekspres до KL Sentral. Ориентир начала прогулки — 13:30. <a href="https://www.google.com/maps/search/?api=1&amp;query=KL+Sentral+Kuala+Lumpur">Google Maps</a></li><li>Башни Петронас · Вариант. Башни Петронас во время прогулки. <a href="https://www.google.com/maps/search/?api=1&amp;query=Petronas+Twin+Towers+Kuala+Lumpur">Google Maps</a></li><li>Ужин · Jalan Alor · Вариант. Уличная еда на Jalan Alor. <a href="https://www.google.com/maps/search/?api=1&amp;query=Jalan+Alor+Food+Street+Kuala+Lumpur">Google Maps</a></li><li>Ночью · Отель в Куала-Лумпуре. Одна ночь в Куала-Лумпуре. Отель не выбран.</li></ol></details><details><summary>10 января · Куала-Лумпур → Сингапур</summary><ol><li>08:30–09:00 · Выезд из отеля. Ориентировочный выезд. Отель не выбран.</li><li>09:30 · Куала-Лумпур (KUL). Быть в аэропорту. Терминал 2. <a href="https://www.google.com/maps/search/?api=1&amp;query=Kuala+Lumpur+International+Airport+Terminal+2">Google Maps</a></li><li>12:25 · Куала-Лумпур (KUL). Вылет AirAsia AK711. <a href="https://www.google.com/maps/search/?api=1&amp;query=Kuala+Lumpur+International+Airport+Terminal+2">Google Maps</a></li><li>13:40 · Чанги (SIN). Прилёт в Чанги. Терминал 4. <a href="https://www.google.com/maps/search/?api=1&amp;query=Changi+Airport+Terminal+4">Google Maps</a></li><li>После прилёта · Отель в Сингапуре. Заселение на одну ночь. Отель не указан.</li><li>Вечером · Мерлион. Начало прогулки у залива Марина-Бэй. <a href="https://www.google.com/maps/search/?api=1&amp;query=Merlion+Park+Singapore">Google Maps</a></li><li>Вечером · Jubilee Bridge. Пеший переход от Мерлиона к Esplanade. <a href="https://www.google.com/maps/search/?api=1&amp;query=Jubilee+Bridge+Singapore">Google Maps</a></li><li>Вечером · Набережная Esplanade. Идти по набережной мимо открытой сцены в сторону Helix Bridge. <a href="https://www.google.com/maps/search/?api=1&amp;query=DBS+Foundation+Outdoor+Theatre+at+Esplanade+Singapore">Google Maps</a></li><li>Вечером · Helix Bridge. Перейти пешеходный мост в сторону Marina Bay Sands. <a href="https://www.google.com/maps/search/?api=1&amp;query=Helix+Bridge+Singapore">Google Maps</a></li><li>Вечером · Supertree Grove. Прогулка в Gardens by the Bay. <a href="https://www.google.com/maps/search/?api=1&amp;query=Supertree+Grove+Gardens+by+the+Bay+Singapore">Google Maps</a></li><li>Ужин · Lau Pa Sat. Основной вариант ужина. <a href="https://www.google.com/maps/search/?api=1&amp;query=Lau+Pa+Sat+Singapore">Google Maps</a></li><li>Ужин · Чайнатаун · Альтернатива. Вместо Lau Pa Sat. Конкретное заведение не выбрано. <a href="https://www.google.com/maps/search/?api=1&amp;query=Chinatown+Singapore">Google Maps</a></li><li>После ужина · Clarke Quay · По желанию. Прогулка после ужина. <a href="https://www.google.com/maps/search/?api=1&amp;query=Clarke+Quay+Singapore">Google Maps</a></li></ol></details><details><summary>11 января · Сингапур → Бангкок</summary><ol><li>Утром · Бассейн отеля. Отдых у бассейна. Отель не указан.</li><li>11:30 · Чайнатаун. Прогулка по Чайнатауну. <a href="https://www.google.com/maps/search/?api=1&amp;query=Chinatown+Singapore">Google Maps</a></li><li>12:30 · Hawker Chan. Обед. Адрес: 78 Smith Street. <a href="https://www.google.com/maps/search/?api=1&amp;query=Hawker+Chan+78+Smith+Street+Singapore">Google Maps</a></li><li>14:30 · SkyPark Observation Deck. Смотровая площадка Marina Bay Sands. <a href="https://www.google.com/maps/search/?api=1&amp;query=SkyPark+Observation+Deck+Marina+Bay+Sands+Singapore">Google Maps</a></li><li>Около 16:30 · Haji Lane / Kampong Glam · Если есть время. Только если хватает времени до выезда в аэропорт. <a href="https://www.google.com/maps/search/?api=1&amp;query=Haji+Lane+Kampong+Glam+Singapore">Google Maps</a></li><li>18:00 · Чанги (SIN). Быть в Чанги. Терминал 4. <a href="https://www.google.com/maps/search/?api=1&amp;query=Changi+Airport+Terminal+4">Google Maps</a></li><li>20:40 · Чанги (SIN). Вылет Thai AirAsia FD350. <a href="https://www.google.com/maps/search/?api=1&amp;query=Changi+Airport+Terminal+4">Google Maps</a></li><li>22:05 · Донмыанг (DMK). Прилёт в Донмыанг. Терминал 1. <a href="https://www.google.com/maps/search/?api=1&amp;query=Don+Mueang+International+Airport+Terminal+1">Google Maps</a></li><li>После прилёта · Отель рядом с Донмыангом. Ночь у аэропорта. Забрать оставленные чемоданы.</li></ol></details><details><summary>12 января · Свободный день в Бангкоке</summary><ol><li>Днём · Свободное время. Свободный день в Бангкоке.</li><li>Около 21:00 · Выезд в аэропорт. Выезд в Суварнабхуми. Адрес отправления не указан.</li><li>22:30 · Суварнабхуми (BKK). Быть в Суварнабхуми. Рейс после полуночи, уже 13 января. <a href="https://www.google.com/maps/search/?api=1&amp;query=Suvarnabhumi+Airport">Google Maps</a></li></ol></details><details><summary>13 января · Бангкок → Пекин → Москва</summary><ol><li>01:30 · Суварнабхуми (BKK). Вылет Air China CA980. <a href="https://www.google.com/maps/search/?api=1&amp;query=Suvarnabhumi+Airport">Google Maps</a></li><li>07:10 · Пекин Шоуду (PEK). Прилёт в Пекин Шоуду. <a href="https://www.google.com/maps/search/?api=1&amp;query=Beijing+Capital+International+Airport+Terminal+3">Google Maps</a></li><li>Дунчжимэнь · Если есть время. Аэроэкспресс после контроля, если хватает времени. <a href="https://www.google.com/maps/search/?api=1&amp;query=Dongzhimen+Airport+Express+Station+Beijing">Google Maps</a></li><li>Храм Юнхэгун · Если есть время. Посещение храма во время пересадки. <a href="https://www.google.com/maps/search/?api=1&amp;query=Lama+Temple+Yonghegong+Beijing">Google Maps</a></li><li>Улица Гоцзыцзянь · Если есть время. Прогулка после храма. <a href="https://www.google.com/maps/search/?api=1&amp;query=Guozijian+Street+Beijing">Google Maps</a></li><li>Переулок Удаоин · Если есть время. Последняя остановка перед возвращением в аэропорт. <a href="https://www.google.com/maps/search/?api=1&amp;query=Wudaoying+Hutong+Beijing">Google Maps</a></li><li>12:15 · Пекин Шоуду (PEK). Быть обратно в аэропорту, если выезжали в город. <a href="https://www.google.com/maps/search/?api=1&amp;query=Beijing+Capital+International+Airport+Terminal+3">Google Maps</a></li><li>14:15 · Пекин Шоуду (PEK). Вылет Air China CA909. <a href="https://www.google.com/maps/search/?api=1&amp;query=Beijing+Capital+International+Airport+Terminal+3">Google Maps</a></li><li>17:40 · Шереметьево (SVO). Прилёт в Шереметьево. <a href="https://www.google.com/maps/search/?api=1&amp;query=Sheremetyevo+Terminal+C">Google Maps</a></li></ol></details></section></noscript>

  return element;
}
function googleLink(value, params) {
  return 'https://www.google.com/maps/' + value + '/?' + new URLSearchParams({api:'1', ...params});
}
function direction(keys) {
  const endpoints = keys.map(key => places[key][3]);
  // The midpoint pins place the route on the pedestrian bridges themselves.
  const middle = keys.slice(1,-1).map(key =>
    ['jubilee','esplanade','helix'].includes(key) ? coord(key).join(',') : places[key][3]);
  return googleLink('dir', {origin:endpoints[0],destination:endpoints[endpoints.length - 1],travelmode:'walking',
    ...(middle.length ? {waypoints:middle.join('|')} : {})});
}
function link(title, href) {
  const result = node('a','link',title);
  result.href = href;
  result.target = '_blank';
  result.rel = 'noopener noreferrer';
  return result;
}
function activateTiles() {
  const shown = !map.hasLayer(streets);
  get('tiles').setAttribute('aria-pressed', String(shown));
  get('tiles').textContent = shown ? 'Перейти к схеме' : 'Показать улицы';
  if (shown) {
    map.removeLayer(outline);
    streets.addTo(map);
    get('tileState').textContent = 'Загружаются улицы OpenStreetMap.';
  } else {
    map.removeLayer(streets);
    outline.addTo(map);
    get('tileState').textContent = 'Схема доступна без интернета. Слой улиц загружается отдельно.';
  }
}
streets.on('load', () => {
 if (!map.hasLayer(streets)) return;
 const loaded = streets.getContainer()?.querySelector('.leaflet-tile-loaded');
 if (loaded) get('tileState').textContent = 'Карта улиц · OpenStreetMap';
 else {
   activateTiles();
   get('tileState').textContent = 'Улицы недоступны. Можно повторить загрузку кнопкой «Показать улицы».';
 }
});
function fit(bounds, maxZoom=15) {
  if (bounds?.isValid()) map.fitBounds(bounds,{padding:[35,38],maxZoom,animate:false});
}
function curved(from, to) {
  const a = coord(from);
  const b = coord(to);
  if (a[1] > b[1]) return curved(to,from).reverse();
  const bend = Math.min(10,Math.abs(b[1]-a[1]) * 0.13 + Math.abs(a[0]-b[0])*0.14);
  return Array.from({length:25}, (_, index) => {
    const t = index / 24;
    return [a[0]+(b[0]-a[0])*t + Math.sin(Math.PI*t)*bend,a[1]+(b[1]-a[1])*t];
  });
}
function polyline(kind, points, option, title) {
  const dashed = kind==='flight' ? '8 6' : kind==='ferry' ? '2 7' : option ? '5 5' : null;
  const shape = L.polyline(points,{
    color:colors[kind],weight:kind==='walk'?4:3.5,opacity:option?.62:.86,dashArray:dashed,
    interactive:Boolean(title), bubblingMouseEvents:false
  }).addTo(overlay);
  if (title) shape.bindTooltip(title,{sticky:true});
}
function highlight(key) {
  selected = key || '';
  document.querySelectorAll('.stop[data-id]').forEach(button => button.classList.toggle('selected', button.dataset.id===selected));
  for (const [id,marker] of markers) marker.getElement()?.classList.toggle('selected',id===selected);
}
function makePopup(group) {
  const popup = node('div');
  popup.append(node('strong','',places[group.key][0]));
  for (const event of group.events) {
    const entry = node('div','entry');
    const [,,note,status] = event.stop;
    const when = [active ? '' : labelDate(event.date),event.stop[1] || 'Время не указано',status].filter(Boolean).join(' · ');
    entry.append(node('p','time',when),node('p','',note));
    popup.append(entry);
  }
  popup.append(link('Открыть в Google Maps',googleLink('search',{query:places[group.key][3]})));
  return popup;
}
function makeMarker(group) {
  const option = group.events.every(event => Boolean(event.stop[3]));
  const airport = airports.includes(group.key);
  const glyph = active ? String(group.events[0].order) : airport ? group.key.toUpperCase() : '●';
  const width = !active&&airport ? 44 : 34;
  const icon = L.divIcon({className:'pin'+(option?' option':'')+(airport?' airport':''),html:glyph,iconSize:[width,34],iconAnchor:[width/2,17],popupAnchor:[0,-15]});
  const marker = L.marker(coord(group.key),{icon,title:places[group.key][0],alt:places[group.key][0],riseOnHover:true});
  marker.bindPopup(makePopup(group),{maxWidth:215,minWidth:165,maxHeight:155,autoPanPadding:[14,20],keepInView:true});
  marker.on('popupopen',() => highlight(group.key));
  marker.on('popupclose',() => highlight(''));
  marker.on('add', () => { marker.getElement().dataset.place = group.key; });
  marker.addTo(pins);
  markers.set(group.key,marker);
}
function renderPins() {
  if (map.getZoom() >= 12 || active) {
    // Keep an open marker stable when zooming inside the detailed view.
    if (pins.getLayers().length===activeGroups.length && markers.size===activeGroups.length) return;
    pins.clearLayers();
    markers.clear();
    activeGroups.forEach(makeMarker);
    return;
  }
  pins.clearLayers();
  markers.clear();
  const clusters = [];
  for (const group of activeGroups) {
    const px = map.project(coord(group.key));
    const cluster = clusters.find(item => item.px.distanceTo(px)<48);
    if (cluster) cluster.groups.push(group);
    else clusters.push({px,groups:[group]});
  }
  for (const cluster of clusters) {
    if (cluster.groups.length===1) {
      makeMarker(cluster.groups[0]);
      continue;
    }
    const bounds = metrics(cluster.groups.map(group => group.key));
    const title = cluster.groups.map(group => places[group.key][0]).join(', ');
    const icon = L.divIcon({className:'pin cluster',html:String(cluster.groups.length),iconSize:[37,37]});
    L.marker(bounds.getCenter(),{icon,title,alt:'Приблизить: '+title})
      .on('click',() => fit(bounds.pad(.2),13)).addTo(pins);
  }
}
function showStop(key) {
  let marker = markers.get(key);
  if (!marker) {
    map.setView(coord(key),13,{animate:false});
    renderPins();
    marker = markers.get(key);
  }
  if (marker) {
    const point = marker.getLatLng();
    if (!map.getBounds().pad(-.15).contains(point)) map.panTo(point,{animate:false});
    if(map.getZoom()<14) map.setView(point,14,{animate:false});
    (markers.get(key)||marker).openPopup();
    if (matchMedia('(max-width:760px)').matches) get('map').scrollIntoView({block:'start'});
  }
}
function renderPlan(day) {
  const list = node('ol',day ? 'stops' : 'all-days');
  get('day-title').textContent = day ? day[1] : 'План поездки';
  get('day-subtitle').textContent = day ? longDate(day[0]) + ' · время местное' : 'Выберите дату, чтобы открыть план дня.';
  if (day) {
    day[2].forEach(([key,time,note,status,custom],index) => {
      const li = node('li');
      const item = node(key?'button':'div','stop');
      if (key) {
        item.type = 'button';
        item.dataset.id = key;
        item.addEventListener('click',() => showStop(key));
      }
      const heading = node('span','stop-title');
      heading.append(node('span','order',String(index+1)),node('span','',custom || places[key][0]));
      if (time) heading.append(node('span','time',time));
      if (status) heading.append(node('span','status',status));
      item.append(heading,node('span','note',note));
      li.append(item);
      list.append(li);
    });
  } else {
    days.forEach(([date,title]) => {
      const li = node('li');
      const item = node('button','',labelDate(date)+' · '+title);
      item.type = 'button';
      item.onclick = () => { selectDay(date); get('dates').scrollIntoView({block:'nearest'}); };
      li.append(item);
      list.append(li);
    });
  }
  get('plan-list').replaceChildren(list);
}
function selectDay(date, moving=false) {
  active = date;
  highlight('');
  map.closePopup();
  overlay.clearLayers();
  pins.clearLayers();
  markers.clear();
  const day = byDate.get(date);
  if(day)day[2]=suggested(day);
  if(!moving)controls(date);
  const grouped = new Map();
  for (const [eventDate,,stops] of day?[day]:days) {
    stops.forEach((stop,index) => {
      const key = stop[0];
      if (!key || (!day && !overviewStops.includes(key))) return;
      if (!grouped.has(key)) grouped.set(key,{key,events:[]});
      grouped.get(key).events.push({date:eventDate,stop,order:index+1});
    });
  }
  activeGroups = Array.from(grouped.values());
  const plotted = activeGroups.map(group => coord(group.key));
  for (const [dates,from,to,flight] of flightSegments) {
    if (day && !dates.includes(date)) continue;
    const points = curved(from,to);
    polyline('flight',points,false,flight+' · '+places[from][0]+' → '+places[to][0]);
    plotted.push(...points);
  }
  currentWalk = null;
  for (const [kind, keys, optional] of day?(roads[date]||[]):Object.values(roads).flat()) {
    if(day && settings[date]?.some(Number) && optional && keys.some(k=>typeof k==='string' && !day[2].some(s=>s[0]===k)))continue;
    const points = keys.map(coord);
    polyline(kind,points,optional,kind==='ferry'?'Паром в обе стороны · причал на Ко Лане не указан':null);
    plotted.push(...points);
    if (day && kind==='walk' && (!currentWalk || (!optional && date==='2027-01-10'))) {
      currentWalk = L.latLngBounds(points);
    }
  }
  const chosen=day?.[2].find(s=>s[3]==='По предпочтениям');
  let variant=[];
  if(chosen?.[0]) {
   const idx=day[2].indexOf(chosen);
   const prev=day[2].slice(0,idx).reverse().find(s=>s[0]&&!s[3]&&!airports.includes(s[0]));
   const next=day[2].slice(idx+1).find(s=>s[0]&&!s[3]&&!airports.includes(s[0]));
   variant=[prev?.[0],chosen[0],next?.[0]].filter((k,i,a)=>k&&k!==a[i-1]);
   if(variant.length>1)polyline(['01-09','01-10','01-11','01-13'].includes(short(date))?'walk':'land',variant.map(coord),true,'Предложенный участок');
  }
  currentBounds = L.latLngBounds(plotted);
  if(!moving) fit(currentWalk && ['2027-01-09','2027-01-10','2027-01-11'].includes(date) ? currentWalk : currentBounds);
  renderPins();
  get('focusWalk').hidden = !day || !walks.some(([walkDate]) => walkDate===date);
  get('overview').setAttribute('aria-pressed',String(!day));
  for (const [buttonDate,button] of dateButtons) button.setAttribute('aria-pressed',String(buttonDate===date));
  dateButtons.get(date)?.scrollIntoView({block:'nearest',inline:'nearest'});
  renderPlan(day);
  const items = walks.filter(([walkDate]) => !day || !walks.some(([d]) => d===date) || walkDate===date)
    .map(([,title,keys]) => {
      const li = node('li');
      li.append(link(title,direction(keys)));
      return li;
    });
  if(variant.length>1){const li=node('li');li.append(link('Маршрут по предпочтениям',direction(variant).replace('travelmode=walking','travelmode='+(['01-09','01-10','01-11','01-13'].includes(short(date))?'walking':'driving'))));items.unshift(li);}
  get('walk-links').replaceChildren(...items);
}
for (const [date,title] of days) {
  const button = node('button','',labelDate(date));
  button.type = 'button';
  button.setAttribute('aria-label',longDate(date)+' · '+title);
  button.onclick = () => selectDay(date);
  dateButtons.set(date,button);
  get('dates').append(button);
}
map.on('zoomend',renderPins);
get('overview').onclick = () => selectDay('');
get('fit').onclick = () => {map.closePopup();fit(currentBounds);};

get('tiles').onclick = activateTiles;
const preferences = ['Еда','Активный отдых','Культура','Спокойный отдых'];
const originals = new Map(days.map(([date,,stops])=>[date,stops.slice()]));
const alternatives = {
 breeze:['Breezeo',12.9233,100.8603,'Breezeo Royal Cliff Pattaya','Морепродукты на открытой террасе у моря. Спокойный ужин после прогулки.',[5,0,0,4],'https://www.royalcliff.com/restaurant/breezeo/'],
 sook:['SOOKSIAM',13.7265,100.5101,'SOOKSIAM ICONSIAM Bangkok','Шумный крытый рынок внутри ICONSIAM. Удобно пробовать несколько региональных блюд.',[5,1,3,1],'https://www.iconsiam.com/'],
 lum:['Парк Люмпини',13.7314,100.5418,'Lumphini Park Bangkok','Прогулка у озера рядом с One Bangkok. Темп и длину круга выбираете сами.',[0,5,0,4],'https://www.tourismthailand.org/'],
 klpark:['KLCC Park',3.1553,101.7145,'KLCC Park Kuala Lumpur','Дорожки и виды на башни. Можно ограничиться коротким кругом.',[0,5,0,3],'https://www.suriaklcc.com.my/'],
 penang:['Little Penang Kafe',3.1574,101.7121,'Little Penang Kafe Suria KLCC','Малайзийская кухня за столиком в Suria KLCC. Более спокойная остановка, чем вечерняя Jalan Alor.',[5,0,2,4],'https://www.suriaklcc.com.my/fnb-campaign-participating-tenants/'],
 maxwell:['Maxwell Food Centre',1.2804,103.8448,'Maxwell Food Centre Singapore','Оживлённый хокер-центр с местной кухней и общими столами. Возможны очереди.',[5,1,2,0],'https://www.visitsingapore.com/neighbourhood/featured-neighbourhood/chinatown/'],

};
for(const [key,item] of Object.entries(alternatives)) places[key]=item.slice(0,4);
const profiles={
 icon:[3,1,3,2],one:[3,2,1,4],tien:[0,1,0,5],samae:[1,4,0,2],zoo:[0,5,2,0],class:[5,1,3,1],petronas:[0,3,5,1],alor:[5,2,2,0],clarke:[2,4,1,0],haji:[1,4,4,1],resort:[0,0,0,5],view:[0,5,1,1],truth:[0,1,5,1],float:[4,2,3,0],buddha:[0,2,5,2],cab:[5,0,1,4],walking:[2,5,1,0],china:[3,3,4,1],lau:[5,1,2,1]
};
const slots={
 '12-30':['sook','lum'], '12-31':['icon','one','sook','lum'],
 '01-01':['view','breeze','resort'],'01-02':['tien','samae'],
 '01-03':['breeze','view','resort'],'01-04':['resort','cab'],

 '01-07':['breeze','resort'],'01-09':['petronas','alor','klpark','penang'],
 '01-10':['lau','maxwell'],'01-11':['tooth','maxwell'],
 '01-12':['sook','lum','one'],'01-13':['coffee']
};
const notes={view:'Короткая прогулка к панораме Паттайи.',resort:'Спокойная пауза у отеля.',cab:'Ужин в саду у моря.',one:'Современный городской квартал и рестораны.',icon:'Набережная и магазины у реки.',lau:'Исторический павильон, общие столы и оживлённый вечер.'};
const settings={};

const panel=document.createElement('section');
panel.className='card';
get('plan').before(panel);
const short=date=>date.slice(5);
function suggested(day){
 const date=day[0],base=originals.get(date),prefs=settings[date], pool=slots[short(date)];
 if(!pool||!prefs||!prefs.some(Number))return base;
 const score=key=>(alternatives[key]?.[5]||profiles[key]).reduce((sum,n,i)=>sum+n*prefs[i],0);
 const key=pool.slice().sort((a,b)=>score(b)-score(a))[0];
 if(score(key)===0)return base;
 const original=base.find(s=>s[0]===key||(key==='class'&&s[4]==='Кулинарный мастер-класс'));
 const entry=original?original.slice():[key,'',alternatives[key]?.[4]||notes[key]||'Остановка по вашим предпочтениям.'];
 entry[3]='По предпочтениям';

 const replacements={'12-31':['icon','one'],'01-02':['tien','samae'],'01-06':['zoo','class'],'01-09':['petronas','alor'],'01-10':['lau','china']};
 const remove=replacements[dateKey]||[];
 const first=base.findIndex(s=>remove.includes(s[0]||'class'));
 let plan=base.filter(s=>!remove.includes(s[0]||'class'));
 if(original&&plan.includes(original))return plan;
 const before={'01-01':'cab','01-07':'resort','01-11':'hawker','01-13':'wudao'};
 let position=first>=0?first:before[dateKey]?plan.findIndex(s=>s[0]===before[dateKey]):plan.length;
 if(dateKey==='01-12')position=1;
 if(dateKey==='01-13')entry[2]+=' Вариант при пересадке.';
 if(dateKey==='01-04')entry[2]+=' После возвращения из Банг Саре.';
 if(dateKey==='01-11')entry[2]+=' Короткая остановка между 11:30 и обедом в 12:30, если хватает времени.';
 plan.splice(position<0?plan.length:position,0,entry);
 return plan;
}
function controls(date){

 });

}
